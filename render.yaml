# Render Blueprint: Dashboard Render -> New -> Blueprint -> pilih repo GitHub ini.
services:
  - type: web
    name: migration-ds
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: MAX_RUNNING_JOBS
        value: "4"
      - key: RETENTION_HOURS
        value: "3"
